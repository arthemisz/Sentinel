[package]
name = "sentinel-core"
version = "0.1.0"
edition = "2024"

[lib]
name = "sentinel_core"
crate-type = ["cdylib", "rlib", "staticlib"]

[[bin]]
name = "sentinel-core"
path = "src/main.rs"

[dependencies]
tree-sitter = "0.22"
tree-sitter-javascript = "0.21"
tree-sitter-typescript = "0.21"
tree-sitter-python = "0.21"
tree-sitter-go = "0.21"
petgraph = { version = "0.6", features = ["serde-1"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
clap = { version = "4.4", features = ["derive"] }
rayon = "1.10"
walkdir = "2.4"
anyhow = "1.0"
thiserror = "1.0"
regex = "1.10"
